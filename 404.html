<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Sharifuzzaman Hasan</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0a" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@1&family=Mona+Sans:wdth,wght@75..125,200..900&display=swap"
    />
    <script>
      (function () {
        var t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        try {
          var s = localStorage.getItem("theme");
          if (s === "light" || s === "dark") t = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0a;
        --fg: #edece7;
        --fg-2: #a7a6a0;
        --fg-3: #82817b;
        --line: rgba(237, 236, 231, 0.1);
        --line-2: rgba(237, 236, 231, 0.18);
        --accent: #ff5b2e;
        --gutter: clamp(16px, 3.6vw, 56px);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f2f0ea;
        --fg: #121211;
        --fg-2: #52514c;
        --fg-3: #6a6963;
        --line: rgba(18, 18, 17, 0.11);
        --line-2: rgba(18, 18, 17, 0.2);
        --accent: #e8471c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
        padding: 24px var(--gutter) 32px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Mona Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 1.5px solid var(--accent);
        outline-offset: 3px;
      }
      .top,
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .brand i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      .mono {
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .code {
        font-size: clamp(6rem, 26vw, 22rem);
        line-height: 0.8;
        font-weight: 300;
        letter-spacing: -0.07em;
        margin-left: -0.04em;
      }
      h1 {
        margin-top: 0.4em;
        font-size: clamp(2rem, 5.6vw, 5rem);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 500;
      }
      h1 em {
        font-family: "Instrument Serif", ui-serif, Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 1.06em;
        letter-spacing: -0.02em;
      }
      p.lede {
        max-width: 40ch;
        margin-top: 24px;
        color: var(--fg-2);
        font-size: 17px;
        line-height: 1.55;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        margin-top: 36px;
        padding: 0 26px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        font-size: 15px;
        font-weight: 500;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn:hover {
        transform: translateX(-4px);
      }
      .bottom {
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/"><i aria-hidden="true"></i>Sharifuzzaman Hasan</a>
      <span class="mono">Error 404</span>
    </header>

    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Nothing behind <em>this screen.</em></h1>
      <p class="lede">The page you’re looking for doesn’t exist or has moved. The rest of the system is running fine.</p>
      <a class="btn" href="/">← Back to the homepage</a>
    </main>

    <footer class="bottom mono">
      <span>© 2026 Sharifuzzaman Hasan</span>
      <a href="mailto:shasan2200@gmail.com">shasan2200@gmail.com</a>
    </footer>
  </body>
</html>
